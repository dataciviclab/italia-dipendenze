root: "../../out"
schema_version: 1

dataset:
  name: "resource_dependency_compose"
  source_id: "dataciviclab_composite"
  tags: [dipendenze, risorse, compose, energia, commercio, agricoltura]
  category: economia-reale
  description: "Italy Resource & Dependency Map — joins energy balance, bilateral trade, and fertilizer consumption"
  years: [2026]

support:
  - name: energy
    config: ../../datasets/eurostat-nrg-bal-c/dataset.yml
    years: [2026]
  - name: trade
    config: ../../datasets/comtrade-bilateral/dataset.yml
    years: [2026]
  - name: fertilizer
    config: ../../datasets/fao-fertilizer-consumption/dataset.yml
    years: [2026]

mart:
  tables:
    - name: "mart_resource_dependency"
      sql: "sql/mart_resource_dependency.sql"
    - name: "mart_energy_vs_trade"
      sql: "sql/mart_energy_vs_trade.sql"
  required_tables:
    - "mart_resource_dependency"
    - "mart_energy_vs_trade"
  validate:
    table_rules:
      mart_resource_dependency:
        required_columns: [year, resource, physical_id_pct, hhi, top1_supplier, top1_share_pct, data_quality]
        primary_key: [year, resource]
        min_rows: 1
      mart_energy_vs_trade:
        required_columns: [year, product, physical_id_pct, trade_hhi, top1_supplier, data_quality]
        min_rows: 1

validation:
  fail_on_error: true
