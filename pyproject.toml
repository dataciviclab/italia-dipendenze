[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dipendenze-risorse"
version = "0.1.0"
description = "Italy Resource & Dependency Map — dati sulle dipendenze strategiche"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
    "pandas>=2.0.0",
    "requests>=2.28",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/dipendenze-risorse"

[tool.toolkit.extends]
source_id = "dipendenze_risorse"

[tool.pytest.ini_options]
markers = [
    "smoke: end-to-end minimum, golden path only",
]
