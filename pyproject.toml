[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-italia-dipendenze"
version = "0.1.0"
description = "Italy Resource & Dependency Map — dati sulle dipendenze strategiche"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
    "pandas>=2.0.0",
    "requests>=2.28",
    "comtradeapicall>=1.3.0",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/italia-dipendenze"

[tool.toolkit.extends]
source_id = "italia_dipendenze"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.pytest.ini_options]
markers = [
    "smoke: end-to-end minimum, golden path only",
    "regression: protects a bug already seen (not a generic contract)",
]
