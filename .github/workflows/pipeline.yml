name: pipeline
on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "compose/**"
      - "scripts/**"
      - ".github/workflows/pipeline.yml"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: dipendenze-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    env:
      TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
      COMTRADE_SUBSCRIPTION_KEY: ${{ secrets.COMTRADE_SUBSCRIPTION_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "pipeline"

      - name: Run datasets
        run: make run-all

      - name: Verify output
        run: make verify

      - uses: google-github-actions/auth@v3
        id: gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: GCS sync
        run: |
          gsutil -m rsync -r out/data/clean/ gs://dataciviclab-clean/italia_dipendenze/
          gsutil -m rsync -r out/data/mart/ gs://dataciviclab-mart/italia_dipendenze/

      - uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          prefix: "italia_dipendenze"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
